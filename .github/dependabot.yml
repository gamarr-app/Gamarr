# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for more information:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
# https://containers.dev/guide/dependabot

version: 2
updates:
 - package-ecosystem: "devcontainers"
   directory: "/"
   schedule:
     interval: weekly
   groups:
     devcontainers:
       patterns: ["*"]

 - package-ecosystem: "npm"
   directory: "/"
   schedule:
     interval: weekly
   groups:
     npm-minor-patch:
       update-types: ["minor", "patch"]

 - package-ecosystem: "nuget"
   directory: "/src"
   schedule:
     interval: weekly
   groups:
     nuget-minor-patch:
       update-types: ["minor", "patch"]
   # SixLabors.ImageSharp went commercial-license in 4.0; staying on 3.1.x.
   # The update-types condition alone is not enough: it is not applied to
   # Dependabot *security* updates, which is how 4.1.2 was proposed and merged
   # (#195) and broke the Release build. The explicit range is honoured by both.
   #
   # The bound is 3.2.0, not 4.0.0: 3.2.0 BACKPORTED the licence check into the
   # 3.x line, so it fails the Release build exactly like 4.x does ("No Six
   # Labors license found"). A ">= 4.0.0" bound let the minor-patch group carry
   # 3.2.0 in (#202) and broke the Release build a second time.
   ignore:
     - dependency-name: "SixLabors.ImageSharp"
       versions: [">= 3.2.0"]
       update-types: ["version-update:semver-major", "version-update:semver-minor"]
   # StyleCop.Analyzers 1.3 adds ~400 violations and flips SA1000 (`new (x)` vs
   # `new(x)`), so the bump and the code cleanup must land in one commit. Riding
   # in the minor-patch group it turned every group PR red (#243, #249, #250)
   # and blocked the other bumps. Held until that cleanup is done by hand.
     - dependency-name: "StyleCop.Analyzers"
       versions: [">= 1.2.0"]
   # DryIoc 6 removed CreateChild overloads that DryIoc.Microsoft.DependencyInjection
   # 6.x calls and obsoleted Rules.WithMicrosoftDependencyInjectionRules (CS0618
   # is an error here). Dependabot also splits it per project (#253 Common,
   # #254 Host/Update), so neither PR can pass alone. Sonarr and Radarr are still
   # on DryIoc 5.4.3; follow them and take the major only alongside upstream.
     - dependency-name: "DryIoc.dll"
       update-types: ["version-update:semver-major"]
     - dependency-name: "DryIoc.Microsoft.DependencyInjection"
       update-types: ["version-update:semver-major"]
   # Runtime-band packages (Microsoft.Extensions.*, Microsoft.AspNetCore.*,
   # System.*) follow the .NET major we target (net10). Dependabot proposes the
   # 11.x majors per project (#255, #258, #259), which fails restore with NU1605
   # downgrades against the projects left on 10.x. Take them with the TFM bump.
     - dependency-name: "Microsoft.Extensions.*"
       update-types: ["version-update:semver-major"]
     - dependency-name: "Microsoft.AspNetCore.*"
       update-types: ["version-update:semver-major"]
     - dependency-name: "System.*"
       update-types: ["version-update:semver-major"]
