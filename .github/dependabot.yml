# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for more information:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
# https://containers.dev/guide/dependabot

version: 2
updates:
 - package-ecosystem: "devcontainers"
   directory: "/"
   schedule:
     interval: weekly
   groups:
     devcontainers:
       patterns: ["*"]

 - package-ecosystem: "npm"
   directory: "/"
   schedule:
     interval: weekly
   groups:
     npm-minor-patch:
       update-types: ["minor", "patch"]

 - package-ecosystem: "nuget"
   directory: "/src"
   schedule:
     interval: weekly
   groups:
     nuget-minor-patch:
       update-types: ["minor", "patch"]
   # SixLabors.ImageSharp went commercial-license in 4.0; staying on 3.x.
   # The update-types condition alone is not enough: it is not applied to
   # Dependabot *security* updates, which is how 4.1.2 was proposed and merged
   # (#195) and broke the Release build. The explicit range is honoured by both.
   ignore:
     - dependency-name: "SixLabors.ImageSharp"
       versions: [">= 4.0.0"]
       update-types: ["version-update:semver-major"]
